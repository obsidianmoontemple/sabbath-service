<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxwS9vipElPWxwCUA-0MUyYL5SBgt02zBXhOsvpuOTNOvvJz9fm3_1p-S-7rlzRk0ge/exec";

  let currentStep = 1;
  let audioEnabled = true;
  let nameEntered = false; // Strictly holds all audio until Join Circle is clicked
  let synth = window.speechSynthesis;
  let availableVoices = [];
  let audioCtx = null;
  let ambientOsc1 = null;
  let ambientOsc2 = null;

  /* Ambient Drone & Single Bell Chime */
  function playSanctuaryChimeAndAmbience() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    const chimeOsc = audioCtx.createOscillator();
    const chimeGain = audioCtx.createGain();
    
    chimeOsc.type = 'sine';
    chimeOsc.frequency.setValueAtTime(528, audioCtx.currentTime); 
    
    chimeGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    chimeGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3.5);
    
    chimeOsc.connect(chimeGain);
    chimeGain.connect(audioCtx.destination);
    
    chimeOsc.start();
    chimeOsc.stop(audioCtx.currentTime + 3.5);

    if(!ambientOsc1) {
      ambientOsc1 = audioCtx.createOscillator();
      ambientOsc2 = audioCtx.createOscillator();
      const ambGain = audioCtx.createGain();

      ambientOsc1.type = 'triangle';
      ambientOsc2.type = 'sine';
      
      ambientOsc1.frequency.setValueAtTime(110, audioCtx.currentTime);
      ambientOsc2.frequency.setValueAtTime(164.81, audioCtx.currentTime);

      ambGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

      ambientOsc1.connect(ambGain);
      ambientOsc2.connect(ambGain);
      ambGain.connect(audioCtx.destination);

      ambientOsc1.start();
      ambientOsc2.start();
    }
  }

  function stopAmbience() {
    if(ambientOsc1) {
      ambientOsc1.stop();
      ambientOsc2.stop();
      ambientOsc1 = null;
      ambientOsc2 = null;
    }
  }

  function populateVoices() {
    if (synth) {
      availableVoices = synth.getVoices();
    }
  }

  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoices;
  }

  function getLeaderVoice() {
    return availableVoices.find(v => v.lang.includes('en') && 
      (v.name.includes('Daniel') || v.name.includes('Oliver') || v.name.includes('David') || v.name.includes('Male') || v.name.includes('George'))
    ) || availableVoices.find(v => v.lang.includes('en'));
  }

  function getCovenVoice() {
    return availableVoices.find(v => v.lang.includes('en') && 
      (v.name.includes('Serena') || v.name.includes('Victoria') || v.name.includes('Zira') || v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google UK English Female'))
    ) || availableVoices.find(v => v.lang.includes('en'));
  }

  /* Full Content Database */
  const LITURGY_CONTENT = {

      interactive: `<p style="font-size:13px; color:var(--silver);" id="screen-prompt-text">Enter your name to register your presence at the hearth:</p>
        <input type="text" id="member-name" placeholder="Your Name or Initial">
        <button class="btn" onclick="registerPresence()">Join Circle</button>`
    },
    2: {
      title: "II. Cleansing of Space & Centering",
      body: "<p>Before we strike the flame or speak our prayers, let us shed the dust of the week. Close your eyes. Drop your shoulders away from your ears. Unclench your jaw.</p><blockquote>In this space, you are not defined by what you have accomplished this week. You are held simply because you are here.</blockquote>",
      officiantTeleprompter: "Before we strike the flame or speak our prayers, let us shed the dust of the week. Close your eyes. Drop your shoulders away from your ears. Unclench your jaw. In this space, you are not defined by what you have accomplished this week. You are held simply because you are here.",
      interactive: `<p style="font-size:13px; color:var(--silver);" id="screen-prompt-text">Breathe deeply. Release what you carry.</p>`
    },
    3: {
      title: "III. Lighting of the Altar Tapers",
      body: "<p>The High Priest approaches the altar to light the three sacred tapers for the Ancestors, the Coven, and the Unseen Paths ahead.</p><blockquote>May these flames warm our spirit, illuminate our sanctuary, and signal to all weary souls that here, they have a home.</blockquote>",
      officiantTeleprompter: "The High Priest approaches the altar to light the three sacred tapers for the Ancestors, the Coven, and the Unseen Paths ahead. As the sun dips below the horizon and the shadows lengthen, we strike the sacred flame. May these flames warm our spirit, illuminate our sanctuary, and signal to all weary souls that here, they have a home.",
      interactive: `<p style="font-size:13px; color:var(--silver);" id="screen-prompt-text">Watch the altar tapers light above in real-time as the flames catch.</p>`
    },
    4: {
      title: "IV. Invocation for Harmony & Spoken Litany",
      body: "<p>Spirits of peace, Guardians of the Obsidian Moon, and the ancient forces of the land—be with us as we weave harmony into our lives.</p><p style='margin-top:12px;'><strong>Leader:</strong> From the exhaustion of relentless labor...</p><p><strong>Leader:</strong> From the noise and chatter of the outer world...</p><p><strong>Leader:</strong> From the weight of grief and heavy hearts...</p><p><strong>Leader:</strong> In our shared sacred walk...</p>",
      officiantTeleprompter: "Spirits of peace, Guardians of the Obsidian Moon, and the ancient forces of the land—be with us as we weave harmony into our lives. From the exhaustion of relentless labor, grant us rest. From the noise and chatter of the outer world, grant us quiet mind. From the weight of grief and heavy hearts, grant us healing. In our shared sacred walk, we cultivate joy.",
      interactive: `<p style="font-size:13px; color:var(--silver); margin-bottom:6px;" id="screen-prompt-text">Offer your spoken response with the coven:</p>
        <div class="response-chips">
          <button class="chip-btn" onclick="sendQuickLitany('Grant us rest')">"Grant us rest"</button>
          <button class="chip-btn" onclick="sendQuickLitany('Grant us quiet mind')">"Grant us quiet mind"</button>
          <button class="chip-btn" onclick="sendQuickLitany('Grant us healing')">"Grant us healing"</button>
          <button class="chip-btn" onclick="sendQuickLitany('We cultivate joy')">"We cultivate joy"</button>

    },
    5: {

      body: "<blockquote>When the wheel of the week has turned its length,<br>And the hands are weary from proving strength,<br>We return to the hearth where the moonbeams lie,<br>Underneath the expanse of the evening sky.<br><br>Here is no judgment, here is no race,<br>Only the quiet, welcoming grace.<br>Pour out the cider, break open the bread,<br>By love and by spirit, our souls shall be fed.</blockquote>",
      officiantTeleprompter: "When the wheel of the week has turned its length, and the hands are weary from proving strength, we return to the hearth where the moonbeams lie, underneath the expanse of the evening sky. Here is no judgment, here is no race, only the quiet, welcoming grace. Pour out the cider, break open the bread, by love and by spirit, our souls shall be fed.",
      interactive: ``
    },
    6: {
      title: "VI. Pastoral Homily — Cultivating Joy",
      body: "<p>Listen to the High Priest's address on <strong>Cultivating Joy in the Sacred Path</strong>.</p><p>Remember: Joy on the spiritual path is not an accident; it is a deliberate, radical practice. Reclaim your delight in being alive.</p>",
      officiantTeleprompter: "Listen to the address on Cultivating Joy in the Sacred Path. When we dedicate ourselves to a spiritual path, it is remarkably easy to inherit a subconscious belief that devotion must be heavy to be real. But devotion without joy ceases to be a sanctuary. Joy on the spiritual path is a deliberate, radical practice. Reclaim your delight in the magical, beautiful experience of being alive.",
      interactive: ``
    },
    7: {
      title: "VII. Coven Sharing & Open Reflections",
      body: "<p>If you wish to share a single word of gratitude, a quiet victory from your week, or a small joy found along the path, send it to the altar feed.</p>",
      officiantTeleprompter: "If you wish to share a single word of gratitude, a quiet victory from your week, or a small joy found along the path, send it to the altar feed. I open the floor now to the family. If anyone wishes to speak a word of gratitude or share a quiet victory from your week, the circle is listening.",
      interactive: `<textarea id="gratitude-text" rows="2" placeholder="Share a gratitude or small joy..."></textarea>
        <button class="btn" onclick="submitPetition('Gratitude')">Offer Gratitude</button>`
    },
    8: {
      title: "VIII. The Rite of the Loving Cup & Shared Bread",
      body: "<p>Behold the grain and the sweet cider—the cup of life, warmth, and fellowship. As we drink from this Loving Cup, let its sweetness wash away the bitter words of the week.</p>",
      officiantTeleprompter: "Behold the grain and the sweet cider—the cup of life, warmth, and fellowship. As we drink from this Loving Cup, let its sweetness wash away the bitter words of the week.",
      interactive: ``
    },
    9: {
      title: "IX. Silent Petitions at the Altar of Ancestors",
      body: "<p>We hold space now for those who need healing, strength, or quiet light. Type your silent petition or ancestor prayer to be placed on the altar.</p>",
      officiantTeleprompter: "We hold space now for those who need healing, strength, or quiet light. We turn our hearts to the Altar of Ancestors—to those who came before us, and those whose blood and spirit run through our veins. We hold space for your petitions.",
      interactive: `<textarea id="ancestor-text" rows="3" placeholder="Write your petition or ancestor prayer..."></textarea>
        <button class="btn" onclick="submitPetition('Ancestor')">Place on Altar of Ancestors</button>`
    },
    10: {
      title: "X. Benediction & Recessional",
      body: "<blockquote>Go forth into this Sabbath Eve with lightened hearts, restored spirits, and joy in your step. The circle is open, yet ever unbroken. So mote it be!</blockquote>",
      officiantTeleprompter: "Go forth into this Sabbath Eve with lightened hearts, restored spirits, and joy in your step. The circle is open, yet ever unbroken. So mote it be!",
      interactive: `<p style="font-size:13px; color:var(--acid-green); text-align:center;" id="screen-prompt-text">Blessed Be!</p>`
    }
  };

  function toggleSpokenAudio() {
    audioEnabled = !audioEnabled;
    const btn = document.getElementById('voice-toggle-btn');
    btn.classList.toggle('active', audioEnabled);
    btn.textContent = audioEnabled ? 'Audio: ON 🔊' : 'Audio: OFF 🔇';
    
    if(!audioEnabled) {
      stopAmbience();
      if(synth) synth.cancel();
    } else if (nameEntered) {
      speakLiturgy();
    }
  }

  function splitTextIntoSentences(text) {
    if (!text) return [];
    // Strip HTML tags for clean text-to-speech reading
    const cleanText = text.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
    return cleanText.match(/[^.!?]+[.!?]+/g) || [cleanText];
  }

  /* Dual Engine Readout Sequence */
  function speakLiturgy() {
    if(!audioEnabled || !nameEntered || !synth) return;

    synth.cancel(); 
    if (synth.paused) {
      synth.resume();
    }

    if (availableVoices.length === 0) {
      availableVoices = synth.getVoices();
    }

    const currentData = LITURGY_CONTENT[currentStep] || LITURGY_CONTENT[1];
    let speechQueue = [];

    // 1. EXTRACT MEMBER'S SCREEN CONTENT ONLY (Female Voice)
    // Excludes stepBadgeText and stepTitleText as requested
    const stepBodyText = currentData.body || "";
    const promptText = document.getElementById('screen-prompt-text')?.textContent || "";

    const combinedScreenText = `${stepBodyText} ${promptText}`;
    const femaleSentences = splitTextIntoSentences(combinedScreenText);

    femaleSentences.forEach(sentence => {
      if (sentence.trim()) {
        speechQueue.push({ speaker: "coven", text: sentence.trim() });
      }
    });

    // 2. EXTRACT OFFICIANT'S TELEPROMPTER CONTENT (Male Voice)
    const maleSentences = splitTextIntoSentences(currentData.officiantTeleprompter);

    maleSentences.forEach(sentence => {
      if (sentence.trim()) {
        speechQueue.push({ speaker: "leader", text: sentence.trim() });
      }
    });

    let queueIndex = 0;

    function speakNextChunk() {
      if (!audioEnabled || !nameEntered || queueIndex >= speechQueue.length) return;

      const item = speechQueue[queueIndex];
      const utterance = new SpeechSynthesisUtterance(item.text);

      if (item.speaker === "leader") {
        // Officiant Teleprompter Lines: Deep Male Voice
        utterance.rate = 0.80;
        utterance.pitch = 0.70; 
        const voice = getLeaderVoice();
        if (voice) utterance.voice = voice;
      } else {
        // Member Screen Content: Mature Female Voice
        utterance.rate = 0.85;
        utterance.pitch = 0.95; 
        const voice = getCovenVoice();
        if (voice) utterance.voice = voice;
      }

      utterance.onend = () => {
        queueIndex++;
        speakNextChunk();
      };

      utterance.onerror = () => {
        queueIndex++;
        speakNextChunk();
      };

      synth.speak(utterance);
    }

    speakNextChunk();
  }

  async function pollState() {
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getRitualState' })
      });
      const data = await res.json();
      if(data.success) {
        document.getElementById('taper-1').classList.toggle('lit', data.taper1);
        document.getElementById('taper-2').classList.toggle('lit', data.taper2);
        document.getElementById('taper-3').classList.toggle('lit', data.taper3);

        document.getElementById('communion-banner').classList.toggle('active', data.communionActive);

        if(data.currentStep !== currentStep) {
          currentStep = data.currentStep;
          renderStep();
          if(nameEntered) {
            speakLiturgy();
          }
        }
      }
    } catch(err) { console.error("Poll error:", err); }
  }

  function renderStep() {
    const content = LITURGY_CONTENT[currentStep] || LITURGY_CONTENT[1];
    document.getElementById('step-badge').textContent = `Step ${currentStep} of 10`;
    document.getElementById('step-title').textContent = content.title;
    document.getElementById('step-body').innerHTML = content.body;
    document.getElementById('interactive-zone').innerHTML = content.interactive;
  }

  async function registerPresence() {
    const nameInput = document.getElementById('member-name');
    const name = nameInput ? nameInput.value.trim() : 'Anonymous';
    
    // Unlock Audio Sequence Only Once Name is Entered & Submitted
    nameEntered = true;

    try {
      await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'logAttendance', name: name })
      });
      document.getElementById('interactive-zone').innerHTML = `<p style="color:var(--acid-green);" id="screen-prompt-text">Welcome to the circle, ${name}.</p>`;
    } catch(err) { console.error(err); }

    // Start Audio Sequence
    if (audioEnabled) {
      playSanctuaryChimeAndAmbience();
      setTimeout(speakLiturgy, 500);
    }
  }

  async function sendQuickLitany(text) {
    try {
      await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitPetition', name: 'Coven Member', text: text, type: 'Litany' })
      });
      
      if(audioEnabled && synth) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.85;
        utterance.pitch = 0.95;
        const voice = getCovenVoice();
        if(voice) utterance.voice = voice;
        synth.speak(utterance);
      } else {
        alert(`Spoken: "${text}"`);
      }
    } catch(err) { console.error(err); }
  }

  async function submitPetition(type) {
    const inputId = type === 'Gratitude' ? 'gratitude-text' : 'ancestor-text';
    const textEl = document.getElementById(inputId);
    const text = textEl.value.trim();
    if(!text) return;

    try {
      await fetch(API_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitPetition', name: 'Coven Member', text: text, type: type })
      });
      textEl.value = '';
      alert('Your petition has been placed upon the altar.');
    } catch(err) { console.error(err); }
  }

  function blessCup(btn) {
    btn.disabled = true;
    btn.textContent = "Blessed & Partaken ✨";
  }

  window.addEventListener('DOMContentLoaded', () => {
    populateVoices();
    renderStep();
    setInterval(pollState, 3000);
  });
</script>
