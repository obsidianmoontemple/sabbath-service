<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>High Priest Command Dashboard — Temple of the Obsidian Moon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --obsidian: #07060a;
    --obsidian-card: #0e0a17;
    --indigo: #130d24;
    --indigo-2: #1b1233;
    --amethyst: #6e3ba7;
    --amethyst-glow: #9d5bd2;
    --amethyst-light: #c092f0;
    --silver: #adabcc;
    --moonwhite: #f1effa;
    --acid-green: #39ff14;
    --acid-green-glow: rgba(57, 255, 20, 0.4);
    --line: rgba(157, 91, 210, 0.22);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--obsidian);
    color: var(--moonwhite);
    font-family: 'Work Sans', sans-serif;
    font-weight: 300;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: var(--indigo);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--moonwhite);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand span { color: var(--acid-green); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--acid-green); padding: 2px 6px; border-radius: 2px; }

  .status-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--acid-green);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 8px; height: 8px; background: var(--acid-green); border-radius: 50%; box-shadow: 0 0 8px var(--acid-green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    gap: 20px;
    padding: 20px;
    flex: 1;
  }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--obsidian-card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--amethyst-light);
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Controls Panel */
  .step-btn {
    background: var(--indigo-2);
    border: 1px solid var(--line);
    color: var(--moonwhite);
    padding: 12px 14px;
    border-radius: 4px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .step-btn:hover { border-color: var(--amethyst-glow); }
  .step-btn.active {
    background: var(--purple-deep);
    border-color: var(--acid-green);
    box-shadow: 0 0 10px var(--acid-green-glow);
  }
  .step-btn .step-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--acid-green); text-transform: uppercase; }
  .step-btn .step-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; }

  .taper-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .taper-btn {
    background: var(--indigo);
    border: 1px solid var(--line);
    color: var(--silver);
    padding: 12px 8px;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    transition: all 0.2s ease;
  }
  .taper-btn.lit {
    background: rgba(57, 255, 20, 0.15);
    border-color: var(--acid-green);
    color: var(--acid-green);
    box-shadow: 0 0 12px var(--acid-green-glow);
  }

  .action-btn {
    background: var(--acid-green);
    color: var(--obsidian);
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 10px var(--acid-green-glow);
  }
  .action-btn:hover { background: #52ff38; }
  .action-btn.active { background: #ff3860; color: white; box-shadow: 0 0 10px rgba(255,56,96,0.4); }

  /* Script Teleprompter */
  .script-container {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    line-height: 1.7;
    color: var(--moonwhite);
    overflow-y: auto;
    max-height: 75vh;
    padding-right: 10px;
  }
  .script-container blockquote {
    border-left: 3px solid var(--acid-green);
    margin: 16px 0;
    padding-left: 18px;
    font-style: italic;
    color: #ffffff;
  }
  .script-container h3 { font-size: 24px; color: var(--amethyst-light); margin-top: 24px; margin-bottom: 8px; }
  .script-container .stage-dir { font-family: 'Work Sans', sans-serif; font-size: 13px; color: var(--silver); font-style: normal; background: var(--indigo); padding: 6px 12px; border-radius: 3px; display: inline-block; margin: 8px 0; }

  /* Petitions Feed */
  .petitions-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: 70vh; }
  .petition-card {
    background: var(--indigo);
    border-left: 3px solid var(--amethyst-light);
    padding: 12px 14px;
    border-radius: 0 4px 4px 0;
  }
  .petition-card.Ancestor { border-left-color: var(--acid-green); }
  .petition-card.Gratitude { border-left-color: #ffd700; }
  .petition-card .meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--silver); text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .petition-card .text { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic; margin: 0; color: var(--moonwhite); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--amethyst); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    Temple of the Obsidian Moon <span>High Priest Dashboard</span>
  </div>
  <div class="status-badge">
    <div class="dot"></div> ENGINE LIVE · SYNCED TO COVEN
  </div>
</header>

<div class="layout">

  <!-- LEFT COLUMN: CONTROLS -->
  <div class="panel">
    <h2 class="panel-title">Master Ritual Controls</h2>

    <div>
      <label style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--silver); text-transform:uppercase; display:block; margin-bottom:8px;">Altar Tapers</label>
      <div class="taper-grid">
        <button class="taper-btn" id="taper1-btn" onclick="toggleTaper(1)">TAPER 1<br><span id="taper1-status">OFF</span></button>
        <button class="taper-btn" id="taper2-btn" onclick="toggleTaper(2)">TAPER 2<br><span id="taper2-status">OFF</span></button>
        <button class="taper-btn" id="taper3-btn" onclick="toggleTaper(3)">TAPER 3<br><span id="taper3-status">OFF</span></button>
      </div>
    </div>

    <div>
      <label style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--silver); text-transform:uppercase; display:block; margin-bottom:8px;">Loving Cup Ritual</label>
      <button class="action-btn" id="communion-btn" onclick="toggleCommunion()" style="width:100%;">Initiate Loving Cup Rite</button>
    </div>

    <div style="margin-top:10px;">
      <label style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--silver); text-transform:uppercase; display:block; margin-bottom:8px;">Liturgy Sequence</label>
      <div style="display:flex; flex-direction:column; gap:8px;" id="step-buttons">
        <!-- Step Buttons Injected dynamically -->
      </div>
    </div>
  </div>

  <!-- CENTER COLUMN: OFFICIANT LITURGY TEXT -->
  <div class="panel">
    <h2 class="panel-title">Officiant Teleprompter <span id="current-step-label" style="font-size:13px; color:var(--acid-green); font-family:'IBM Plex Mono', monospace;">Step 1 / 10</span></h2>
    <div class="script-container" id="script-display">
      <!-- Liturgy Script content displays based on selected step -->
    </div>
  </div>

  <!-- RIGHT COLUMN: LIVE PETITION & GRATITUDE FEED -->
  <div class="panel">
    <h2 class="panel-title">Live Coven Petitions <span id="petition-count" style="font-size:12px; color:var(--acid-green);">0</span></h2>
    <div class="petitions-list" id="petitions-feed">
      <div style="font-size:13px; color:var(--silver); font-style:italic; text-align:center; padding:20px 0;">
        Awaiting live prayers and ancestor petitions from the coven...
      </div>
    </div>
  </div>

</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxwS9vipElPWxwCUA-0MUyYL5SBgt02zBXhOsvpuOTNOvvJz9fm3_1p-S-7rlzRk0ge/exec";

  let currentState = {
    currentStep: 1,
    taper1: false,
    taper2: false,
    taper3: false,
    communionActive: false,
    petitions: []
  };

  const LITURGY_STEPS = [
    { num: 1, title: "I. Gathering & Opening Silence", duration: "~5 mins" },
    { num: 2, title: "II. Cleansing of Space & Centering", duration: "~5 mins" },
    { num: 3, title: "III. Lighting of the Altar Tapers", duration: "~5 mins" },
    { num: 4, title: "IV. Invocation for Harmony & Spoken Litany", duration: "~5 mins" },
    { num: 5, title: "V. Song or Poem of Devotion", duration: "~5 mins" },
    { num: 6, title: "VI. Pastoral Homily", duration: "~15-20 mins" },
    { num: 7, title: "VII. Coven Sharing & Open Reflections", duration: "~5-10 mins" },
    { num: 8, title: "VIII. The Rite of the Loving Cup & Shared Bread", duration: "~10 mins" },
    { num: 9, title: "IX. Silent Petitions at the Altar of Ancestors", duration: "~5 mins" },
    { num: 10, title: "X. Benediction & Recessional", duration: "~3 mins" }
  ];

  const SCRIPT_CONTENT = {
    1: `
      <h3>I. Gathering & Opening Silence</h3>
      <div class="stage-dir">Ring bell or singing bowl three times. Allow ambient audio to settle the room.</div>
      <p>Welcome, family of the night and travellers of the sacred path. Take your places as we enter into the quiet threshold of our Sabbath Eve.</p>
    `,
    2: `
      <h3>II. Cleansing of Space & Centering</h3>
      <p>Before we strike the flame or speak our prayers, let us shed the dust of the week. Close your eyes. Drop your shoulders away from your ears. Unclench your jaw.</p>
      <p>Breathe in deeply—drawing in the cool, quiet stillness of the evening dusk...</p>
      <p>And exhale fully—releasing the deadlines, the labor, the noise, and the worries that do not belong in this hour.</p>
      <blockquote>In this space, you are not defined by what you have accomplished this week. You are held simply because you are here.</blockquote>
    `,
    3: `
      <h3>III. Lighting of the Altar Tapers</h3>
      <div class="stage-dir">Approach the altar and toggle Taper 1, 2, and 3 buttons as you recite each stanza.</div>
      <p><strong>Leader:</strong> "As the sun dips below the horizon and the shadows lengthen, we strike the sacred flame."</p>
      <blockquote>"We light the First Taper for the Ancestors who walked before us and cleared the overgrown trails." [Light Taper 1]</blockquote>
      <blockquote>"We light the Second Taper for the Coven here gathered—those in presence and those joining from afar—that our hearts remain bound across distance." [Light Taper 2]</blockquote>
      <blockquote>"We light the Third Taper for the Unseen Paths ahead, trusting the dark to guide our feet as gently as the light." [Light Taper 3]</blockquote>
      <p>"May these flames warm our spirit, illuminate our sanctuary, and signal to all weary souls that here, they have a home."</p>
    `,
    4: `
      <h3>IV. Invocation for Harmony & Spoken Litany</h3>
      <p><strong>Leader:</strong> "Spirits of peace, Guardians of the Obsidian Moon, and the ancient forces of the land—we invite your presence into our circle tonight. Be with us as we weave harmony into our lives."</p>
      <p>Leader: "From the exhaustion of relentless labor..."<br><em>Coven Response: "Grant us rest."</em></p>
      <p>Leader: "From the noise and chatter of the outer world..."<br><em>Coven Response: "Grant us quiet mind."</em></p>
      <p>Leader: "From the weight of grief and heavy hearts..."<br><em>Coven Response: "Grant us healing."</em></p>
      <p>Leader: "In our shared sacred walk..."<br><em>Coven Response: "We cultivate joy."</em></p>
    `,
    5: `
      <h3>V. Song or Poem of Devotion</h3>
      <blockquote>
        "When the wheel of the week has turned its length,<br>
        And the hands are weary from proving strength,<br>
        We return to the hearth where the moonbeams lie,<br>
        Underneath the expanse of the evening sky.<br><br>
        Here is no judgment, here is no race,<br>
        Only the quiet, welcoming grace.<br>
        Pour out the cider, break open the bread,<br>
        By love and by spirit, our souls shall be fed."
      </blockquote>
    `,
    6: `
      <h3>VI. Pastoral Homily — Cultivating Joy in the Sacred Path</h3>
      <p><strong>Part I: The Trap of Heavy Devotion</strong></p>
      <p>When we dedicate ourselves to a spiritual path—when we build altars, study ancient lore, craft rituals, and hold space for others—it is remarkably easy to inherit a subconscious belief that devotion must be heavy to be real.</p>
      <p>We begin to measure our spiritual growth solely by our discipline, our endurance, or how much weight we can carry on our shoulders without collapsing. But devotion without joy ceases to be a sanctuary; it becomes merely another obligation on a long list of chores.</p>

      <p><strong>Part II: Joy as a Sacred Practice</strong></p>
      <p>Joy on the spiritual path is not something that happens to us by accident when everything in life is perfect. Joy is a deliberate, radical practice. It is taking five minutes to sit with your companions, your hounds, or the cool desert breeze at twilight and recognizing that <em>this right now</em> is the sacred life you are building.</p>

      <p><strong>Part III: The Strength of the Shared Hearth</strong></p>
      <p>Tonight, as we stand at the threshold of the Sabbath Eve, let us redefine what it means to walk this path together. We walk together to multiply our light. When one of us forgets how to laugh, the coven holds the joy for them. Reclaim your delight in the magical, messy, beautiful experience of being alive.</p>
    `,
    7: `
      <h3>VII. Coven Sharing & Open Reflections</h3>
      <div class="stage-dir">Invite brief words of gratitude from the room or read incoming submissions from the live feed.</div>
      <p><strong>Leader:</strong> "I open the floor now to the family. If anyone wishes to speak a single word of gratitude, share a quiet victory from your week, or name a small joy you found along the path, the circle is listening."</p>
    `,
    8: `
      <h3>VIII. The Rite of the Loving Cup & Shared Bread</h3>
      <div class="stage-dir">Click 'Initiate Loving Cup Rite' button to activate the communion screen for coven members.</div>
      <p><strong>Leader (Lifting Bread):</strong> "Behold the grain—nurtured by the dark soil, fed by the rains, and ripened under the sun. As we break this bread, let it ground our bodies, heal our tiredness, and remind us of the simple gifts of the earth."</p>
      <p><strong>Leader (Lifting Chalice):</strong> "Behold the sweet yield of the orchard—the cup of life, warmth, and fellowship. As we drink from this Loving Cup, let its sweetness wash away the bitter words of the week."</p>
    `,
    9: `
      <h3>IX. Silent Petitions at the Altar of Ancestors</h3>
      <div class="stage-dir">Hold 5 minutes of quiet space. Watch the right panel as coven petitions appear live.</div>
      <p><strong>Leader:</strong> "We turn our hearts to the Altar of Ancestors—to those who came before us, those who loved us, and those whose blood and spirit run through our veins. We hold five minutes of sacred silence for your petitions."</p>
    `,
    10: `
      <h3>X. Benediction & Recessional</h3>
      <p><strong>Leader:</strong> "The candles may be extinguished, but the flame inside our hearts remains burning bright. The circle is open, yet ever unbroken."</p>
      <blockquote>"Go forth into this Sabbath Eve with lightened hearts, restored spirits, and joy in your step. So mote it be!"</blockquote>
      <div class="stage-dir">Snuff tapers and conclude service.</div>
    `
  };

  function initButtons() {
    const container = document.getElementById('step-buttons');
    container.innerHTML = LITURGY_STEPS.map(s => `
      <button class="step-btn ${currentState.currentStep === s.num ? 'active' : ''}" onclick="setStep(${s.num})" id="step-btn-${s.num}">
        <span class="step-num">${s.duration}</span>
        <span class="step-name">${s.title}</span>
      </button>
    `).join('');
    renderScript();
  }

  function renderScript() {
    document.getElementById('script-display').innerHTML = SCRIPT_CONTENT[currentState.currentStep] || '';
    document.getElementById('current-step-label').textContent = `Step ${currentState.currentStep} / 10`;
  }

  async function setStep(num) {
    currentState.currentStep = num;
    document.querySelectorAll('.step-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (i + 1) === num);
    });
    renderScript();

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'setStep', step: num })
      });
    } catch(err) { console.error("Error updating step:", err); }
  }

  async function toggleTaper(num) {
    const key = `taper${num}`;
    currentState[key] = !currentState[key];
    updateTaperUI(num);

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'toggleTaper', taperNumber: num, isLit: currentState[key] })
      });
    } catch(err) { console.error("Error toggling taper:", err); }
  }

  function updateTaperUI(num) {
    const isLit = currentState[`taper${num}`];
    const btn = document.getElementById(`taper${num}-btn`);
    const status = document.getElementById(`taper${num}-status`);
    btn.classList.toggle('lit', isLit);
    status.textContent = isLit ? 'LIT 🔥' : 'OFF';
  }

  async function toggleCommunion() {
    currentState.communionActive = !currentState.communionActive;
    const btn = document.getElementById('communion-btn');
    btn.classList.toggle('active', currentState.communionActive);
    btn.textContent = currentState.communionActive ? 'End Loving Cup Rite' : 'Initiate Loving Cup Rite';

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'toggleCommunion', active: currentState.communionActive })
      });
    } catch(err) { console.error("Error toggling communion:", err); }
  }

  async function pollState() {
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getRitualState' })
      });
      const data = await res.json();
      if(data.success) {
        currentState.taper1 = data.taper1;
        currentState.taper2 = data.taper2;
        currentState.taper3 = data.taper3;
        currentState.communionActive = data.communionActive;
        
        updateTaperUI(1);
        updateTaperUI(2);
        updateTaperUI(3);

        if(data.petitions && data.petitions.length > 0) {
          renderPetitions(data.petitions);
        }
      }
    } catch(err) { console.error("Poll error:", err); }
  }

  function renderPetitions(petitions) {
    document.getElementById('petition-count').textContent = petitions.length;
    const list = document.getElementById('petitions-feed');
    list.innerHTML = petitions.map(p => `
      <div class="petition-card ${p.type}">
        <div class="meta">
          <span>${p.name || 'Anonymous'}</span>
          <span>${p.type}</span>
        </div>
        <p class="text">"${p.text}"</p>
      </div>
    `).join('');
  }

  window.addEventListener('DOMContentLoaded', () => {
    initButtons();
    setInterval(pollState, 3000); // Sync state every 3s
  });
</script>
</body>
</html>
