<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lughnasadh Command Dashboard: Reaping What We Sow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
    :root { --obsidian: #07060a; --obsidian-card: #0e0a17; --indigo: #130d24; --indigo-2: #1b1233; --amethyst: #6e3ba7; --amethyst-glow: #9d5bd2; --amethyst-light: #c092f0; --silver: #adabcc; --moonwhite: #f1effa; --acid-green: #39ff14; --acid-green-glow: rgba(57, 255, 20, 0.4); --line: rgba(157, 91, 210, 0.22); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--obsidian); color: var(--moonwhite); font-family: 'Work Sans', sans-serif; font-weight: 300; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    
    header { background: var(--indigo); border-bottom: 1px solid var(--line); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--moonwhite); display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 2px;}
    .brand span { color: var(--acid-green); font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--acid-green); padding: 2px 6px; border-radius: 2px; }
    .header-controls { display: flex; align-items: center; gap: 15px; }
    .status-badge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--acid-green); display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; background: var(--acid-green); border-radius: 50%; box-shadow: 0 0 8px var(--acid-green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }
    
    .layout { display: grid; grid-template-columns: 340px 1fr 360px; gap: 20px; padding: 20px; flex: 1; }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: var(--obsidian-card); border: 1px solid var(--line); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .panel-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 600; color: var(--amethyst-light); border-bottom: 1px solid var(--line); padding-bottom: 8px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
    
    .step-btn { background: var(--indigo-2); border: 1px solid var(--line); color: var(--moonwhite); padding: 12px 14px; border-radius: 4px; text-align: left; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 2px; }
    .step-btn:hover { border-color: var(--amethyst-glow); }
    .step-btn.active { background: #2a1b42; border-color: var(--acid-green); box-shadow: 0 0 10px var(--acid-green-glow); }
    .step-btn .step-num { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--acid-green); text-transform: uppercase; }
    .step-btn .step-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; }
    
    .taper-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
    .taper-btn { background: var(--indigo); border: 1px solid var(--line); color: var(--silver); padding: 10px 6px; border-radius: 4px; cursor: pointer; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; transition: all 0.2s ease; }
    .taper-btn.lit { background: rgba(57, 255, 20, 0.15); border-color: var(--acid-green); color: var(--acid-green); box-shadow: 0 0 12px var(--acid-green-glow); }
    
    .action-btn { background: #d4af37; color: var(--obsidian); font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 0 10px rgba(212, 175, 55, 0.4); }
    .action-btn:hover { background: #fadd70; }
    .action-btn.active { background: #ff3860; color: white; box-shadow: 0 0 10px rgba(255,56,96,0.4); }
    
    .broadcast-input { background: var(--indigo); border: 1px solid var(--line); color: #fff; padding: 10px; font-family: 'Work Sans', sans-serif; font-size: 13px; border-radius: 4px; width: 100%; margin-bottom: 8px; }
    .broadcast-input:focus { outline: none; border-color: var(--amethyst-light); }

    .script-container { font-family: 'Cormorant Garamond', serif; font-size: 19px; line-height: 1.7; color: var(--moonwhite); overflow-y: auto; max-height: 75vh; padding-right: 10px; text-align: left; }
    .script-container blockquote { border-left: 3px solid var(--acid-green); margin: 16px 0; padding-left: 18px; font-style: italic; color: #ffffff; }
    .script-container h3 { font-size: 22px; color: var(--amethyst-light); margin-top: 24px; margin-bottom: 8px; }
    .script-container .stage-dir { font-family: 'Work Sans', sans-serif; font-size: 12px; color: var(--silver); font-style: normal; background: var(--indigo); padding: 6px 12px; border-radius: 3px; display: inline-block; margin: 8px 0; border-left: 3px solid #d4af37; }
    
    .petitions-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: 65vh; text-align: left; }
    .petition-card { background: var(--indigo); border-left: 3px solid var(--amethyst-light); padding: 12px 14px; border-radius: 0 4px 4px 0; }
    .petition-card.Shadow { border-left-color: #ff3860; }
    .petition-card.Harvest { border-left-color: #d4af37; }
    .petition-card.Interaction { border-left-color: #39ff14; }
    .petition-card .meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--silver); text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .petition-card .text { font-family: 'Work Sans', sans-serif; font-size: 14px; margin: 0; color: var(--moonwhite); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--amethyst); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <div class="brand">Lughnasadh Command Dashboard <span>High Priest Mode</span></div>
  <div class="header-controls">
    <div class="status-badge"><div class="dot"></div> ENGINE LIVE · FULL COVEN SYNC</div>
  </div>
</header>

<div class="layout">
  <!-- LEFT COLUMN: CONTROLS -->
  <div class="panel">
    <h2 class="panel-title">Master Temple Controls</h2>
    <button class="action-btn" style="background: #ff3860; color: white; width: 100%; box-shadow: 0 0 10px rgba(255,56,96,0.4);" onclick="masterReset()">MASTER ENGINE RESET</button>

    <!-- LIVE BROADCAST BANNER CONTROL -->
    <div style="margin-top: 5px; background: var(--indigo); padding: 12px; border-radius: 4px; border: 1px solid var(--line);">
      <label style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--acid-green); text-transform:uppercase; display:block; margin-bottom:6px;">Push Banner to Coven</label>
      <input type="text" id="broadcast-text" class="broadcast-input" placeholder="Type message for early arrivals...">
      <div style="display: flex; gap: 8px;">
        <button class="action-btn" style="flex:1; padding:8px; font-size:11px; background:var(--amethyst); color:#fff;" onclick="sendBroadcast(true)">Broadcast</button>
        <button class="action-btn" style="flex:1; padding:8px; font-size:11px; background:#333; color:#aaa;" onclick="sendBroadcast(false)">Clear Banner</button>
      </div>
    </div>

    <div>
      <label style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--silver); text-transform:uppercase; display:block; margin-bottom:6px;">Altar Tapers (3 Main)</label>
      <div class="taper-grid">
        <button class="taper-btn" id="taper1-btn" onclick="toggleTaper(1)">TAPER 1<br><span id="taper1-status">OFF</span></button>
        <button class="taper-btn" id="taper2-btn" onclick="toggleTaper(2)">TAPER 2<br><span id="taper2-status">OFF</span></button>
        <button class="taper-btn" id="taper3-btn" onclick="toggleTaper(3)">TAPER 3<br><span id="taper3-status">OFF</span></button>
      </div>
    </div>
    
    <div>
      <label style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--silver); text-transform:uppercase; display:block; margin-bottom:6px;">The Harvest Phase</label>
      <button class="action-btn" id="breaking-btn" onclick="toggleBreaking()" style="width:100%;">Initiate Scythe Reaping</button>
    </div>
    
    <div>
      <label style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--silver); text-transform:uppercase; display:block; margin-bottom:6px;">Liturgy Sequence</label>
      <div style="display:flex; flex-direction:column; gap:6px;" id="step-buttons"></div>
    </div>
  </div>

  <!-- CENTER COLUMN: OFFICIANT SCRIPT -->
  <div class="panel">
    <h2 class="panel-title">Officiant Full Teleprompter <span id="current-step-label" style="font-size:13px; color:var(--acid-green); font-family:'IBM Plex Mono', monospace;">Step 1 / 6</span></h2>
    <div class="script-container" id="script-display"></div>
  </div>

  <!-- RIGHT COLUMN: LIVE COVEN INTERACTION AUDIT FEED -->
  <div class="panel">
    <h2 class="panel-title">Coven Audit Feed <span id="petition-count" style="font-size:12px; color:var(--acid-green);">0</span></h2>
    <div class="petitions-list" id="petitions-feed">
      <div style="font-size:13px; color:var(--silver); font-style:italic; text-align:center; padding:20px 0;">
        Tracking all seeker entries, node clicks, and path choices in real time...
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxwS9vipElPWxwCUA-0MUyYL5SBgt02zBXhOsvpuOTNOvvJz9fm3_1p-S-7rlzRk0ge/exec";

  let currentState = {
    currentStep: 1,
    taper1: false,
    taper2: false,
    taper3: false,
    breakingActive: false,
    petitions: []
  };

  const LITURGY_STEPS = [
    { num: 1, title: "I. The Early Threshold & Greeting", duration: "Pre-Gathering" },
    { num: 2, title: "II. Casting the Compass", duration: "~5 mins" },
    { num: 3, title: "III. Multipractice Focus", duration: "~5 mins" },
    { num: 4, title: "IV. Reaping & Cutting Intent", duration: "~10 mins" },
    { num: 5, title: "V. The First Harvest Working", duration: "~5 mins" },
    { num: 6, title: "VI. Devocation & Closing", duration: "~3 mins" }
  ];

  const SCRIPT_CONTENT = {
    1: `<h3>I. Early Threshold & Greeting</h3><div class="stage-dir">Early arrivals are greeted with notice to await the High Priest and verify Discord connection. Keep altar tapers unlit until ready to open.</div><p>Welcome to this Weekly Temple Talk: Reaping What We Sow from a multipractice perspective. This Lughnasadh, we move far beyond standard holiday tropes and dig deep into the ancient, eclectic roots of the First Harvest.</p><blockquote>Across global cultures, the first cutting of grain has always symbolized a profound pact: what we cultivate through our dedication, our shadow work, and our will is precisely what we manifest in our lives. Bring your favorite seasonal brew, ensure you are engaged within our Discord sanctuary, and open your grimoire as we explore sacrifice, survival, and sovereignty.</blockquote>`,
    2: `<h3>II. Casting the Multicultural Compass</h3><div class="stage-dir">Light Taper 1, 2, and 3 as you invoke each direction. Coven nodes unlock sequentially on participant screens.</div><p>We cast this compass not merely within four physical walls, but across the vast digital astral plane, uniting our energies. Listen closely as each quarter is invoked.</p><p><strong>To the East</strong>, we call upon the breath of intellect, the winds of change, and the clarity that cuts through mental fog.</p><p><strong>To the South</strong>, we ignite the fire of the sovereign will, the inner forge that refines our passions and incinerates hesitation.</p><p><strong>To the West</strong>, we plunge into the deep waters of the subconscious, honoring emotional resilience and ancestral memory.</p><p><strong>To the North</strong>, we anchor into the dark soil of the earth, the bone, the stone, and the silicon beneath our fingers—knowing intimately that decay is the ultimate fertilizer of growth.</p><blockquote>Now, we awaken the fifth element of Spirit, binding all quarters into one living, cyber-magical pentacle. The compass is cast. We stand between worlds.</blockquote>`,
    3: `<h3>III. Multipractice Perspectives & Focus</h3><div class="stage-dir">Direct seekers to choose their path focus on their interactive screens.</div><p>Now we examine the duality of our working: reaping from both the light and the dark perspective. Traditional folk magic celebrates the tangible bounty of the sun, gratitude for the golden grain, and the preservation of communal survival.</p><p>Conversely, Left-Hand Path and esoteric shadow frameworks teach us the necessity of ruthless pruning—cutting away parasitic attachments, dead habits, and toxic obligations that drain our personal power.</p><blockquote>Wielding harvest magic requires absolute intent. Whether you cultivate the light of abundance or sever the rot with a razor-sharp blade, choose your focus for tonight's working.</blockquote>`,
    4: `<h3>IV. Guided Reaping & Cutting Intent</h3><div class="stage-dir">Monitor live shadow and harvest submissions streaming into the audit feed on the right.</div><p>Close your eyes and breathe in deeply. Focus entirely upon your chosen path.</p><p>Confront the dead weight in your life. With absolute psychological and magical intent, visualize the reaper's scythe slicing away what no longer serves your evolution, transforming past failures into raw fuel.</p><blockquote>"Cut the dead weight. Claim your sovereignty and absolute intent."</blockquote>`,
    5: `<h3>V. The First Harvest Working</h3><div class="stage-dir">Trigger Scythe Reaping phase so coven screens activate the active charging game.</div><p>Look at the faces and energies gathered across our temple network. We are legion, bound by sovereignty and shared purpose.</p><p>Hold up your seasonal brew, your grimoire, or your tokens to the digital ether. We swing the astral scythe and break the bread of life to honor the eternal cycle.</p><blockquote>To live and evolve, we must consume illusion and discard weakness. Swing the scythe! Cut the dead weight! Claim your absolute harvest!</blockquote>`,
    6: `<h3>VI. Devocation & Closing</h3><div class="stage-dir">Extinguish altar tapers and conclude transmission.</div><p>The harvest is claimed, the unnecessary ties are severed, and the Wheel turns inexorably onward. We give profound thanks to the Clergy, the elemental forces, and the Ancestors who guide our craft.</p><p>Go forth in absolute power, retaining the sovereign ownership of your own path.</p><blockquote>The compass is open, but our connection remains unbroken. So it is done.</blockquote>`
  };

  function initButtons() {
    const container = document.getElementById('step-buttons');
    container.innerHTML = LITURGY_STEPS.map(s => `
      <button class="step-btn ${currentState.currentStep === s.num ? 'active' : ''}" onclick="setStep(${s.num})" id="step-btn-${s.num}">
        <span class="step-num">${s.duration}</span>
        <span class="step-name">${s.title}</span>
      </button>
    `).join('');
    renderScript();
  }

  function renderScript() {
    document.getElementById('script-display').innerHTML = SCRIPT_CONTENT[currentState.currentStep] || '';
    document.getElementById('current-step-label').textContent = `Step ${currentState.currentStep} / 6`;
  }

  async function setStep(num) {
    currentState.currentStep = num;
    document.querySelectorAll('.step-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (i + 1) === num);
    });
    renderScript();

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'setStep', step: num })
      });
    } catch(err) {}
  }

  async function toggleTaper(num) {
    const key = `taper${num}`;
    currentState[key] = !currentState[key];
    updateTaperUI(num);

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'toggleTaper', taperNumber: num, isLit: currentState[key] })
      });
    } catch(err) {}
  }

  function updateTaperUI(num) {
    const isLit = currentState[`taper${num}`];
    const btn = document.getElementById(`taper${num}-btn`);
    const status = document.getElementById(`taper${num}-status`);
    if(btn) {
      btn.classList.toggle('lit', isLit);
      status.textContent = isLit ? 'LIT 🔥' : 'OFF';
    }
  }

  async function sendBroadcast(active) {
    const textVal = document.getElementById('broadcast-text').value.trim();
    const payload = {
      action: 'setBroadcast',
      active: active,
      title: "Temple Clergy Notice",
      text: active ? (textVal || "Please await your High Priest and ensure you are connected in Discord!") : ""
    };

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      alert(active ? "Broadcast banner pushed to coven screens." : "Broadcast banner cleared.");
    } catch(err) {
      alert("Error sending broadcast.");
    }
  }

  async function toggleBreaking() {
    currentState.breakingActive = !currentState.breakingActive;
    const btn = document.getElementById('breaking-btn');
    btn.classList.toggle('active', currentState.breakingActive);
    btn.textContent = currentState.breakingActive ? 'End Reaping Phase' : 'Initiate Scythe Reaping';

    try {
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'toggleCommunion', active: currentState.breakingActive }) 
      });
    } catch(err) {}
  }

  async function masterReset() {
    if(!confirm("Reset the temple to Step 1 and extinguish all tapers?")) return;
    currentState.breakingActive = false;
    currentState.taper1 = false;
    currentState.taper2 = false;
    currentState.taper3 = false;
    updateTaperUI(1); updateTaperUI(2); updateTaperUI(3);
    setStep(1);

    try {
      await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'setStep', step: 1 }) });
      setTimeout(() => { location.reload(); }, 1000);
    } catch(err) {}
  }

  async function pollState() {
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getRitualState' })
      });
      const data = await res.json();
      if(data.success) {
        currentState.taper1 = data.taper1;
        currentState.taper2 = data.taper2;
        currentState.taper3 = data.taper3;
        currentState.breakingActive = data.communionActive; 
        
        updateTaperUI(1); updateTaperUI(2); updateTaperUI(3);

        if(data.petitions && data.petitions.length > 0) {
          renderPetitions(data.petitions);
        }
      }
    } catch(err) {}
  }

  function renderPetitions(petitions) {
    document.getElementById('petition-count').textContent = petitions.length;
    const list = document.getElementById('petitions-feed');
    list.innerHTML = petitions.map(p => `
      <div class="petition-card ${p.type}">
        <div class="meta">
          <span>${p.name || 'Anonymous'}</span>
          <span>${p.type}</span>
        </div>
        <p class="text">"${p.text}"</p>
      </div>
    `).join('');
  }

  window.addEventListener('DOMContentLoaded', () => {
    initButtons();
    setInterval(pollState, 3000); 
  });
</script>
</body>
</html>
